<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Gift Animation</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600;700&display=swap');

:root {
  --pink: #e02e63;
  --pink-soft: #ff8fb3;
  --pink-light: #ffe3ec;
  --gold: #ffb703;
  --text: #5a3a46;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  min-height: 100%;
}

body {
  font-family: 'Poppins', system-ui, sans-serif;
  color: var(--text);
  background: radial-gradient(circle at 20% 15%, #fff2f7 0%, #ffd9e6 40%, #ffc2d8 100%);
  overflow-x: hidden;
}

#wrapper {
  position: relative;
  min-height: 100vh;
  width: 100%;
  padding: 90px 22px 70px;
}

/* ------------------------------------------------------------- bunting flag */
.flag__birthday {
  position: absolute;
  inset: 0 0 auto 0;
  pointer-events: none;
  z-index: 5;
}

.flag__birthday img {
  position: absolute;
  top: -12px;
  width: 350px;
  max-width: 42vw;
  opacity: 0;
  animation: flagDrop 1.2s ease forwards;
}

.flag__left {
  left: -20px;
}

.flag__right {
  right: -20px;
  transform: scaleX(-1);
  animation-delay: .2s;
}

@keyframes flagDrop {
  from { opacity: 0; transform: translateY(-60px); }
  to { opacity: 1; transform: translateY(0); }
}

.flag__right {
  animation-name: flagDropRight;
}

@keyframes flagDropRight {
  from { opacity: 0; transform: scaleX(-1) translateY(-60px); }
  to { opacity: 1; transform: scaleX(-1) translateY(0); }
}

/* ---------------------------------------------------------------- layout */
.content {
  position: relative;
  z-index: 2;
  max-width: 1150px;
  margin: 0 auto;
  min-height: calc(100vh - 180px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 40px;
  flex-wrap: wrap;
}

.left {
  flex: 1 1 420px;
  min-width: 300px;
}

/* ------------------------------------------------------------------ title */
.title {
  position: relative;
  display: inline-block;
}

.title h1 {
  font-family: 'Dancing Script', cursive;
  font-size: clamp(54px, 9vw, 96px);
  line-height: .95;
  color: var(--pink);
  text-shadow: 3px 4px 0 rgba(255, 255, 255, .8), 6px 8px 18px rgba(224, 46, 99, .25);
  white-space: nowrap;
}

.title h1 span {
  display: inline-block;
  opacity: 0;
  animation: letterPop .7s cubic-bezier(.2, .9, .3, 1.4) forwards;
  animation-delay: var(--t, 4s);
}

@keyframes letterPop {
  0% { opacity: 0; transform: translateY(-50px) rotate(-25deg) scale(.4); }
  100% { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
}

.happy span:nth-child(even) {
  animation-name: letterPopAlt;
}

@keyframes letterPopAlt {
  0% { opacity: 0; transform: translateY(50px) rotate(25deg) scale(.4); }
  100% { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
}

.hat {
  position: absolute;
  top: -58px;
  right: -30px;
  opacity: 0;
  animation: hatIn .8s ease 6.6s forwards, hatWobble 3s ease-in-out 7.4s infinite;
}

.hat img {
  width: 130px;
  filter: drop-shadow(0 8px 12px rgba(224, 46, 99, .25));
}

@keyframes hatIn {
  from { opacity: 0; transform: translateY(-40px) rotate(-40deg); }
  to { opacity: 1; transform: translateY(0) rotate(0); }
}

@keyframes hatWobble {
  0%, 100% { transform: rotate(-6deg); }
  50% { transform: rotate(6deg); }
}

/* -------------------------------------------------------------- date of birth */
.date__of__birth {
  margin-top: 26px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: clamp(18px, 2.4vw, 26px);
  font-weight: 600;
  letter-spacing: 1px;
  color: var(--pink);
  text-transform: capitalize;
  min-height: 40px;
}

.date__of__birth i {
  color: var(--gold);
  animation: twinkle 1.4s ease-in-out infinite;
}

/* ------------------------------------------------------------- button */
.btn {
  margin-top: 30px;
}

#btn__letter {
  font-family: 'Poppins', sans-serif;
  font-size: 16px;
  font-weight: 600;
  color: #fff;
  padding: 14px 30px;
  border: none;
  border-radius: 40px;
  background: linear-gradient(135deg, #ff5c8a, #e02e63);
  box-shadow: 0 12px 26px rgba(224, 46, 99, .35);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  transition: transform .2s, box-shadow .2s;
  animation: pulseBtn 2.4s ease-in-out infinite;
  opacity: 0;
  animation: btnIn .6s ease 6.8s forwards, pulseBtn 2.4s ease-in-out 7.4s infinite;
}

#btn__letter:hover {
  transform: translateY(-3px) scale(1.04);
  box-shadow: 0 18px 34px rgba(224, 46, 99, .45);
}

@keyframes btnIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulseBtn {
  0%, 100% { box-shadow: 0 12px 26px rgba(224, 46, 99, .35); }
  50% { box-shadow: 0 12px 34px rgba(224, 46, 99, .6); }
}

/* ------------------------------------------------------------------- right */
.right {
  position: relative;
  flex: 0 0 360px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.box__account {
  position: relative;
  width: 300px;
  padding: 14px 14px 20px;
  background: #fff;
  border-radius: 24px;
  box-shadow: 0 22px 50px rgba(224, 46, 99, .22);
  text-align: center;
}

.box__account .image {
  width: 100%;
  aspect-ratio: 1;
  overflow: hidden;
  border-radius: 18px;
  border: 4px solid var(--pink-light);
}

.box__account .image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.box__account .name {
  margin-top: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--pink);
  font-family: 'Dancing Script', cursive;
  font-size: 30px;
  font-weight: 700;
}

.box__account .name i {
  font-size: 16px;
  color: #ff3366;
  animation: heartBeat 1.2s ease-in-out infinite;
}

@keyframes heartBeat {
  0%, 100% { transform: scale(1); }
  25% { transform: scale(1.3); }
  40% { transform: scale(1); }
}

.balloon_one,
.balloon_two {
  position: absolute;
  top: -20px;
  width: 100px;
  animation: floatBalloon 3.4s ease-in-out infinite;
}

.balloon_one {
  left: -70px;
}

.balloon_two {
  right: -70px;
  top: 30px;
  animation-delay: .8s;
}

.balloon_one img,
.balloon_two img {
  width: 100px;
  display: block;
}

@keyframes floatBalloon {
  0%, 100% { transform: translateY(0) rotate(-4deg); }
  50% { transform: translateY(-22px) rotate(4deg); }
}

/* ---------------------------------------------------------- circular text */
.cricle {
  position: relative;
  width: 320px;
  height: 320px;
  margin-top: 20px;
  border-radius: 50%;
}

.cricle i {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 46px;
  color: var(--pink);
  animation: heartBeat 1.4s ease-in-out infinite;
}

.text__cricle {
  position: absolute;
  inset: 0;
  animation: spinCircle 18s linear infinite;
}

.text__cricle span {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(calc(var(--i) * 24deg)) translateY(-140px);
  font-size: 18px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--pink);
  text-shadow: 1px 1px 0 #fff;
}

@keyframes spinCircle {
  to { transform: rotate(360deg); }
}

/* ------------------------------------------------------------- decorations */
.decorate_star {
  position: absolute;
  width: 22px;
  height: 22px;
  background: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0Ij4KICA8cGF0aCBkPSJNMTIgMWwyLjkgNi4zIDYuOS44LTUuMSA0LjcgMS40IDYuOEwxMiAxNi45IDUuOSAxOS42bDEuNC02LjhMMi4yIDguMWw2LjktLjh6IiBmaWxsPSIjZmZkMTY2Ii8+Cjwvc3ZnPgo=") center/contain no-repeat;
  opacity: 0;
  animation: starIn .5s ease forwards, twinkle 1.6s ease-in-out infinite;
  animation-delay: var(--t, 15s), var(--t, 15s);
  pointer-events: none;
}

@keyframes starIn {
  from { opacity: 0; transform: scale(0); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes twinkle {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .35; transform: scale(.75); }
}

.star1 { top: 18%; left: 6%; }
.star2 { top: 30%; left: 12%; width: 16px; height: 16px; }
.star3 { top: 60%; left: 4%; width: 26px; height: 26px; }
.star4 { top: 74%; left: 46%; width: 18px; height: 18px; }
.star5 { top: 24%; right: 8%; width: 20px; height: 20px; }

.decorate_flower--one,
.decorate_flower--two,
.decorate_flower--three {
  position: absolute;
  opacity: 0;
  animation: flowerIn .6s ease forwards, floatFlower 4s ease-in-out infinite;
  animation-delay: var(--t, 15s), var(--t, 15s);
  pointer-events: none;
}

@keyframes flowerIn {
  from { opacity: 0; transform: scale(0) rotate(-90deg); }
  to { opacity: 1; transform: scale(1) rotate(0); }
}

@keyframes floatFlower {
  0%, 100% { transform: translateY(0) rotate(0); }
  50% { transform: translateY(-12px) rotate(15deg); }
}

.decorate_flower--one { top: 16%; right: 14%; }
.decorate_flower--two { top: 52%; right: 6%; }
.decorate_flower--three { top: 84%; right: 30%; }

.decorate_bottom {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  pointer-events: none;
  z-index: 1;
}

.decorate_bottom img {
  width: 100%;
  height: 70px;
  object-fit: cover;
  display: block;
}

.smiley__icon {
  position: absolute;
  right: 26px;
  bottom: 30px;
  z-index: 3;
  animation: floatBalloon 3s ease-in-out infinite;
}

.smiley__icon img {
  width: 80px;
  filter: drop-shadow(0 8px 14px rgba(224, 46, 99, .3));
}

/* ------------------------------------------------------------- letter modal */
.box__letter {
  position: fixed;
  inset: 0;
  z-index: 1002;
  display: none;
  background: rgba(60, 20, 35, .55);
  backdrop-filter: blur(3px);
  overflow-y: auto;
}

.letter__border {
  display: none;
  position: relative;
  max-width: 880px;
  margin: 40px auto;
  padding: 12px;
  border-radius: 26px;
  background: linear-gradient(135deg, #ff5c8a, #ffb703);
  box-shadow: 0 30px 70px rgba(0, 0, 0, .35);
}

.letter {
  background: linear-gradient(160deg, #fffdf8, #ffeef5);
  border-radius: 18px;
  padding: 26px 26px 30px;
}

.title__letter {
  font-family: 'Dancing Script', cursive;
  font-size: 46px;
  color: var(--pink);
  text-align: center;
  min-height: 56px;
  margin-bottom: 10px;
}

.title__letter i {
  color: #ff3366;
  font-size: 22px;
  margin-left: 4px;
  animation: heartBeat 1.2s ease-in-out infinite;
}

.content__letter {
  display: flex;
  gap: 26px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
}

.content__letter .left {
  position: relative;
  flex: 0 0 auto;
}

#heart__letter {
  width: 240px;
  max-width: 60vw;
  border-radius: 16px;
  display: block;
}

.heart {
  position: absolute;
  opacity: 0;
  bottom: 10px;
  left: 50%;
}

.heart.animation {
  animation: heartFloat 2s ease-in infinite;
  animation-delay: var(--t);
}

@keyframes heartFloat {
  0% { opacity: 0; transform: translate(-50%, 0) scale(.5); }
  20% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -220px) scale(1.3); }
}

.content__letter .right {
  flex: 1 1 260px;
  min-width: 240px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.love__img img {
  width: 220px;
  max-width: 100%;
  border-radius: 16px;
}

#mewmew {
  width: 80px;
}

#heart__letter,
.love__img,
#mewmew {
  opacity: 0;
  transform: scale(.6);
  transition: opacity .6s ease, transform .6s cubic-bezier(.2, .9, .3, 1.4);
}

#heart__letter.animationOp,
.love__img.animationOp,
#mewmew.animationOp {
  opacity: 1;
  transform: scale(1);
}

.text__letter p {
  font-size: 16px;
  line-height: 1.7;
  color: var(--text);
  text-align: center;
  min-height: 90px;
}

.close {
  position: absolute;
  top: -14px;
  right: -14px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #fff;
  color: var(--pink);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 8px 18px rgba(0, 0, 0, .25);
  transition: transform .2s, background .2s;
}

.close:hover {
  transform: rotate(90deg) scale(1.08);
  background: var(--pink);
  color: #fff;
}

/* ------------------------------------------------------------- responsive */
@media (max-width: 900px) {
  .content {
    justify-content: center;
    text-align: center;
  }

  .left {
    flex: 1 1 100%;
  }

  .date__of__birth {
    justify-content: center;
  }

  .title h1 {
    white-space: normal;
  }

  .hat {
    right: 0;
  }

  .smiley__icon {
    display: none;
  }

  .balloon_one {
    left: -30px;
  }

  .balloon_two {
    right: -30px;
  }
}

@media (max-width: 480px) {
  #wrapper {
    padding-top: 70px;
  }

  .flag__birthday img {
    max-width: 46vw;
  }

  .cricle {
    width: 260px;
    height: 260px;
  }

  .text__cricle span {
    transform: translate(-50%, -50%) rotate(calc(var(--i) * 24deg)) translateY(-112px);
    font-size: 15px;
  }

  .content__letter .left #heart__letter {
    width: 180px;
  }
}

  <script>
    let datetxt = "22 september 2007";
    let datatxtletter = "You are a very special boy. Today, I wish you all the best, lots of health, and lots of joy.  I always hope we will celebrate many more birthdays like this together. Happy birthday to you.💕";
    let titleLetter = "To you";
    let charArrDate = datetxt.split('');
    let charArrDateLetter = datatxtletter.split('');
    let charArrTitle = titleLetter.split('');
    let currentIndex = 0;
    let currentIndexLetter = 0;
    let currentIndexTitle = 0;
    let date__of__birth = document.querySelector(".date__of__birth span");
    let text__letter = document.querySelector(".text__letter p");

    setTimeout(function () {
      timeDatetxt = setInterval(function () {
        if (currentIndex < charArrDate.length) {
          date__of__birth.textContent += charArrDate[currentIndex];
          currentIndex++;
        } else {
          let i = document.createElement("i");
          i.className = "fa-solid fa-star";
          document.querySelector(".date__of__birth").prepend(i);
          document.querySelector(".date__of__birth").appendChild(i.cloneNode(true));
          clearInterval(timeDatetxt);
        }
      }, 100)
    }, 12000);

    var intervalContent;
    var intervalTitle;
    $("#btn__letter").on("click", function () {
      $(".box__letter").slideDown();
      setTimeout(function () {
        $(".letter__border").slideDown();
      }, 1000);
      setTimeout(function () {
        intervalTitle = setInterval(function () {
          if (currentIndexTitle < charArrTitle.length) {
            document.querySelector(".title__letter").textContent += charArrTitle[currentIndexTitle];
            let i = document.createElement("i");
            i.className = "fa-solid fa-heart";
            document.querySelector(".title__letter").appendChild(i);
            currentIndexTitle++;
          } else {
            clearInterval(intervalTitle);
          }
        }, 100);
      }, 2000);
      setTimeout(function () {
        document.querySelector("#heart__letter").classList.add("animationOp");
        document.querySelector(".love__img").classList.add("animationOp");
        document.querySelector("#mewmew").classList.add("animationOp");
      }, 2800);
      setTimeout(function () {
        document.querySelectorAll(".heart").forEach((item) => {
          item.classList.add("animation");
        })
      }, 3500);
      setTimeout(function () {
        intervalContent = setInterval(function () {
          if (currentIndexLetter < charArrDateLetter.length) {
            text__letter.textContent += charArrDateLetter[currentIndexLetter];
            currentIndexLetter++;
          } else {
            clearInterval(intervalContent);
          }
        }, 50);
      }, 6000);
    });

    $(".close").on("click", function () {
      clearInterval(intervalContent);
      document.querySelector(".title__letter").textContent = "";
      text__letter.textContent = "";
      currentIndexLetter = 0;
      currentIndexTitle = 0;
      document.querySelector("#heart__letter").classList.remove("animationOp");
      document.querySelector(".love__img").classList.remove("animationOp");
      document.querySelector("#mewmew").classList.remove("animationOp");
      document.querySelectorAll(".heart").forEach((item) => {
        item.classList.remove("animation");
      });
      $(".box__letter").slideUp();
      $(".letter__border").slideUp();
    });
  </script>
